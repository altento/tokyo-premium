name: Publish Tokyo Premium demo

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install PHP with SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3
      - name: Set up Node.js for browser QA
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test cart state module
        run: npm run test:cart
      - name: Run PHP and SQLite integrity checks
        run: php tests/php_integrity_integration.php
      - name: Check PHP syntax
        run: find . -maxdepth 2 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke test PHP forms and admin access
        run: |
          set -euo pipefail
          export RESTAURANT_DB=/tmp/tokyo-premium-smoke.sqlite
          rm -f "$RESTAURANT_DB"
          php -S 127.0.0.1:8081 -t . > /tmp/tokyo-premium-smoke.log 2>&1 &
          server_pid=$!
          trap 'result=$?; if [ "$result" -ne 0 ]; then cat /tmp/tokyo-premium-smoke.log; fi; kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/ > /dev/null; then break; fi
            sleep 1
          done
          cookies=/tmp/tokyo-premium-smoke.cookies
          page=$(curl --fail --silent --cookie-jar "$cookies" 'http://127.0.0.1:8081/pages.php?page=booking')
          csrf=$(printf '%s' "$page" | sed -n 's/.*name="csrf" value="\([^"]*\)".*/\1/p')
          test -n "$csrf"
          booking_date=$(TZ=Asia/Qyzylorda date +%F)
          booking=$(curl --fail --silent --cookie "$cookies" --cookie-jar "$cookies" --data-urlencode "csrf=$csrf" --data-urlencode 'type=booking' --data-urlencode 'name=Demo Guest' --data-urlencode 'phone=+70000000000' --data-urlencode 'guests=2' --data-urlencode "date=$booking_date" --data-urlencode 'time=18:00' --data-urlencode 'zone=Суши-стойка' --data-urlencode 'table=4' --data-urlencode 'message=Smoke test' http://127.0.0.1:8081/api.php)
          printf '%s' "$booking" | grep -q '"ok":true'
          order=$(curl --fail --silent --cookie "$cookies" --cookie-jar "$cookies" --data-urlencode "csrf=$csrf" --data-urlencode 'type=order' --data-urlencode 'name=Demo Guest' --data-urlencode 'phone=+70000000000' --data-urlencode 'address=' --data-urlencode 'fulfillment=pickup' --data-urlencode 'items=[{"id":1,"qty":2}]' http://127.0.0.1:8081/api.php)
          printf '%s' "$order" | grep -q '"ok":true'
          contact=$(curl --fail --silent --cookie "$cookies" --cookie-jar "$cookies" --data-urlencode "csrf=$csrf" --data-urlencode 'type=contact' --data-urlencode 'name=Demo Guest' --data-urlencode 'email=demo@example.test' --data-urlencode 'subject=Общий вопрос' --data-urlencode 'message=Smoke test message' http://127.0.0.1:8081/api.php)
          printf '%s' "$contact" | grep -q '"ok":true'
          review=$(curl --fail --silent --cookie "$cookies" --cookie-jar "$cookies" --data-urlencode "csrf=$csrf" --data-urlencode 'type=review' --data-urlencode 'name=Demo Guest' --data-urlencode 'rating=5' --data-urlencode 'theme=Кухня' --data-urlencode 'body=This is a fictitious smoke test review.' http://127.0.0.1:8081/api.php)
          printf '%s' "$review" | grep -q '"ok":true'
          admin=$(curl --fail --silent http://127.0.0.1:8081/admin.php)
          printf '%s' "$admin" | grep -q 'Вход в панель'
          if printf '%s' "$admin" | grep -q 'Позиции меню'; then exit 1; fi
          echo 'Booking, order, contact, review and unauthenticated admin smoke checks passed.'
      - name: Export a static demo
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/tokyo-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              break
            fi
            sleep 1
          done
          TOKYO_EXPORT_URL=http://127.0.0.1:8080 php tools/export-pages.php
          test -s docs/premium.css
          test -s docs/pages-demo.js
          test -s docs/account.html
          test -s docs/assets/food/03-nigiri-salmon.webp
          grep -q 'не зашифровано' docs/account.html
      - name: Run browser regression and visual QA
        run: |
          set -euo pipefail
          export RESTAURANT_DB=/tmp/tokyo-premium-browser.sqlite
          rm -f "$RESTAURANT_DB"
          php -S 127.0.0.1:8090 -t . > /tmp/tokyo-premium-browser.log 2>&1 &
          server_pid=$!
          trap 'result=$?; if [ "$result" -ne 0 ]; then cat /tmp/tokyo-premium-browser.log; fi; kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8090/ > /dev/null; then break; fi
            sleep 1
          done
          TOKYO_BASE_URL=http://127.0.0.1:8090 npm run test:browser
          TOKYO_BASE_URL=http://127.0.0.1:8090 TOKYO_STATIC_BASE_URL=http://127.0.0.1:8090/docs npm run test:tokyo20
          TOKYO_BASE_URL=http://127.0.0.1:8090 npm run test:reviews
          TOKYO_BASE_URL=http://127.0.0.1:8090 npm run test:cart-visual
          TOKYO_BASE_URL=http://127.0.0.1:8090 npm run test:responsive
          TOKYO_BASE_URL=http://127.0.0.1:8090 npm run test:visual-states
          TOKYO_BASE_URL=http://127.0.0.1:8090 TOKYO_STATIC_BASE_URL=http://127.0.0.1:8090/docs npm run test:visual-fidelity
          TOKYO_BASE_URL=http://127.0.0.1:8090 TOKYO_STATIC_BASE_URL=http://127.0.0.1:8090/docs npm run test:motion
      - name: Save visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-premium-visual-qa
          path: |
            project-docs/visual-qa/**/*.jpg
            project-docs/visual-qa/**/*.png
          if-no-files-found: warn
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
