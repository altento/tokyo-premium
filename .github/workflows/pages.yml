name: Publish Tokyo Premium demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install PHP with SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3
      - name: Export a static demo
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/tokyo-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              break
            fi
            sleep 1
          done
          TOKYO_EXPORT_URL=http://127.0.0.1:8080 php tools/export-pages.php
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
