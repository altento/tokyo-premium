  <g data-tp-table="5" data-tp-zone="Основной зал" data-capacity="4"><rect class="tp-seat-shape" x="128" y="344" width="74" height="54" rx="18"/><text class="tp-seat-number" x="165" y="371">05</text></g>
  <g data-tp-table="6" data-tp-zone="Основной зал" data-capacity="2"><rect class="tp-seat-shape" x="282" y="344" width="74" height="54" rx="18"/><text class="tp-seat-number" x="319" y="371">06</text></g>

  <g data-tp-table="7" data-tp-zone="Суши-стойка" data-capacity="1"><circle class="tp-seat-shape" cx="625" cy="199" r="18"/><text class="tp-seat-number" x="625" y="199">07</text></g>
  <g data-tp-table="8" data-tp-zone="Суши-стойка" data-capacity="1"><circle class="tp-seat-shape" cx="716" cy="199" r="18"/><text class="tp-seat-number" x="716" y="199">08</text></g>
  <g data-tp-table="9" data-tp-zone="Суши-стойка" data-capacity="1"><circle class="tp-seat-shape" cx="807" cy="199" r="18"/><text class="tp-seat-number" x="807" y="199">09</text></g>

  <g data-tp-table="10" data-tp-zone="Камерная комната" data-capacity="4"><rect class="tp-seat-shape" x="603" y="325" width="74" height="52" rx="18"/><text class="tp-seat-number" x="640" y="351">10</text></g>
  <g data-tp-table="11" data-tp-zone="Камерная комната" data-capacity="4"><rect class="tp-seat-shape" x="758" y="325" width="74" height="52" rx="18"/><text class="tp-seat-number" x="795" y="351">11</text></g>
  <g data-tp-table="12" data-tp-zone="Зал дегустации" data-capacity="2"><rect class="tp-seat-shape" x="713" y="450" width="64" height="48" rx="16"/><text class="tp-seat-number" x="745" y="474">12</text></g>
  <g data-tp-table="13" data-tp-zone="Зал дегустации" data-capacity="4"><rect class="tp-seat-shape" x="808" y="450" width="64" height="48" rx="16"/><text class="tp-seat-number" x="840" y="474">13</text></g>

  <g fill="#ba9154" fill-opacity=".36"><path d="M62 460c13-14 24-14 37 0-13 14-24 14-37 0Zm332-264c12-13 23-13 36 0-13 13-24 13-36 0Z"/><circle cx="78" cy="470" r="3"/><circle cx="419" cy="204" r="3"/></g>
